// Keypad switches for everything in the path traced picture that depends on
// earlier frames, to find which one a fault comes from.
// Use:  exec ptdebug.cfg      (the keys stay bound afterwards)
// They only show a difference in the filtered picture (pt_filter 2, F7).

alias taa_off "pt_taa 0;echo 1 anti-aliasing + upscaler history: OFF;alias t_taa taa_on"
alias taa_on "pt_taa 1;echo 1 anti-aliasing + upscaler history: ON;alias t_taa taa_off"
alias t_taa taa_off

alias hist_off "pt_history 1;echo 2 light history while moving: OFF (1 frame);alias t_hist hist_on"
alias hist_on "pt_history 32;echo 2 light history while moving: ON (32 frames);alias t_hist hist_off"
alias t_hist hist_off

alias dn_off "pt_denoise 0;echo 3 noise filter: OFF;alias t_dn dn_on"
alias dn_on "pt_denoise 4;echo 3 noise filter: ON (4 passes);alias t_dn dn_off"
alias t_dn dn_off

alias ad_off "pt_adaptive 1;echo 4 adaptive sampling: OFF;alias t_ad ad_on"
alias ad_on "pt_adaptive 4;echo 4 adaptive sampling: ON (up to 4x);alias t_ad ad_off"
alias t_ad ad_off

alias ex_off "pt_auto_exposure 0;echo 5 auto exposure: OFF;alias t_ex ex_on"
alias ex_on "pt_auto_exposure 1;echo 5 auto exposure: ON;alias t_ex ex_off"
alias t_ex ex_off

alias up_off "pt_scale 1;echo 6 upscaling: OFF (traced at full size);alias t_up up_on"
alias up_on "pt_scale 0.5;echo 6 upscaling: ON (traced at half size);alias t_up up_off"
alias t_up up_off

alias hv_on "pt_debug 7;echo 7 history view: ON (dark = new, grey = 32 frames or more);alias t_hv hv_off"
alias hv_off "pt_debug 0;echo 7 history view: OFF;alias t_hv hv_on"
alias t_hv hv_on

alias ptd_a "pt_filter 2;pt_taa 1;pt_history 32;pt_denoise 4;pt_adaptive 4;pt_auto_exposure 1;pt_debug 0"
alias ptd_b "alias t_taa taa_off;alias t_hist hist_off;alias t_dn dn_off;alias t_ad ad_off"
alias ptd_c "alias t_ex ex_off;alias t_hv hv_on;echo 0 all of them back ON, filtered picture"
alias ptd_reset "ptd_a;ptd_b;ptd_c"
alias ptd_show "pt_filter;pt_taa;pt_history;pt_denoise;pt_adaptive;pt_auto_exposure;pt_scale;pt_debug"

bind KP_END t_taa
bind KP_DOWNARROW t_hist
bind KP_PGDN t_dn
bind KP_LEFTARROW t_ad
bind KP_5 t_ex
bind KP_RIGHTARROW t_up
bind KP_HOME t_hv
bind KP_INS ptd_reset
bind KP_DEL ptd_show

echo Path tracing debug keys are on the number pad: 1-7 switch, 0 resets, . lists
